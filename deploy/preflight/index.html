<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>INKAJUS · Gestión de Equipo</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #17383c; background: #f3f7f7; }
    * { box-sizing: border-box; }
    body { min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 600px); background: white; border: 1px solid #dce7e7; border-radius: 24px; padding: clamp(28px,6vw,52px); box-shadow: 0 14px 50px #17383c0a; }
    .brand { font-size: 14px; font-weight: 750; letter-spacing: .18em; }
    .state { display: inline-block; margin-top: 32px; padding: 7px 12px; border-radius: 30px; color: #246366; background: #edf5f3; font-size: 13px; }
    h1 { margin: 20px 0 16px; font-size: clamp(28px,5vw,40px); line-height: 1.15; letter-spacing: -.04em; }
    p { margin: 0; color: #627b7e; line-height: 1.7; }
  </style>
</head>
<body>
  <main>
    <div class="brand">INKAJUS</div>
    <span class="state">Espacio en preparación</span>
    <h1>Gestión de Equipo</h1>
    <p>Estamos preparando este espacio. El acceso se habilitará cuando terminemos la configuración de la aplicación.</p>
  </main>
</body>
</html>
